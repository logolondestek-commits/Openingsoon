<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon – Arts Academy</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box}
body,html{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#050505;font-family:Georgia,serif;touch-action:none;user-select:none}
#bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:1;overflow:hidden}
#stage-wall{position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 30%,#1c1008 0%,#0a0603 55%,#000 100%)}
#stage-wall::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0px,transparent 38px,rgba(255,255,255,.018) 38px,rgba(255,255,255,.018) 39px)}
#stage-wall::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 110% 90% at 50% 50%,transparent 30%,rgba(0,0,0,.72) 100%)}
#floor{position:absolute;bottom:0;left:-10%;width:120%;height:38%;background:linear-gradient(to top,rgba(0,0,0,.95) 0%,rgba(0,0,0,.3) 60%,transparent 100%),repeating-linear-gradient(92deg,#1a0e08 0px,#1a0e08 58px,#120a05 58px,#120a05 60px,#1e1209 60px,#1e1209 118px,#0e0703 118px,#0e0703 120px);transform:perspective(600px) rotateX(55deg);transform-origin:bottom center;z-index:2}
#floor::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(180,120,60,.06) 0%,transparent 50%)}
#spotlight{position:absolute;top:-5%;left:50%;transform:translateX(-50%);width:65vw;height:110vh;background:conic-gradient(from 270deg at 50% 0%,transparent 28deg,rgba(255,240,180,.22) 48deg,rgba(255,248,210,.32) 60deg,rgba(255,240,180,.22) 72deg,transparent 92deg);pointer-events:none;z-index:3;mix-blend-mode:screen;opacity:.2}
#spotlight::after{content:'';position:absolute;bottom:-5%;left:50%;transform:translateX(-50%);width:50%;height:22%;background:radial-gradient(ellipse,rgba(255,230,140,.35),transparent 70%);border-radius:50%}
#batten{position:absolute;top:0;left:0;width:100%;height:28px;background:linear-gradient(180deg,#0a0603 0%,#1a1008 60%,transparent 100%);z-index:4}
#batten::after{content:'';position:absolute;bottom:-6px;left:0;width:100%;height:6px;background:repeating-linear-gradient(90deg,transparent 0px,transparent 80px,rgba(255,200,80,.35) 80px,rgba(255,200,80,.35) 84px)}
#wing-l,#wing-r{position:absolute;top:0;width:18%;height:100%;z-index:3;pointer-events:none}
#wing-l{left:0;background:linear-gradient(to right,rgba(0,0,0,.85),transparent)}
#wing-r{right:0;background:linear-gradient(to left,rgba(0,0,0,.85),transparent)}
.dust{position:absolute;background:#fff;border-radius:50%;opacity:0;pointer-events:none;z-index:4}
#content{position:fixed;z-index:5;text-align:center;color:#fff;width:90%;max-width:none;padding:2rem;top:50%;left:50%;transform:translate(-50%,-50%);opacity:1;transition:transform 1.4s cubic-bezier(.4,0,.2,1), opacity 1.2s ease;will-change:transform,opacity;pointer-events:none}

.logo-icon{width:80px;height:80px;margin:0 auto 1.5rem;background:radial-gradient(circle,rgba(255,215,0,.2),transparent 70%);display:flex;align-items:center;justify-content:center;border-radius:50%;opacity:0;animation:fadeUp .8s ease .2s forwards}

#subtitle{opacity:0;animation:fadeUp .7s ease .5s forwards;letter-spacing:.3em}

/* Her harf ayrı span olacak, JS ile inject edilecek */
.char{display:inline-block;opacity:0;transform:translateY(40px) rotateX(-90deg);transform-origin:bottom center;animation:charDrop .6s cubic-bezier(.22,1,.36,1) forwards}

@keyframes charDrop{
  to{opacity:1;transform:translateY(0) rotateX(0deg)}
}

/* Spotlight tarama efekti başlık üzerinde */
#main-title{
  position:relative;overflow:hidden;
  color:#fff;
  opacity:0;
  animation:titleFadeIn .4s ease .8s forwards;
}

/* Altın spotlight tarama — pseudo overlay */
#main-title::after{
  content:'';
  position:absolute;
  top:0;left:-100%;
  width:60%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,215,0,.55),transparent);
  animation:sweepLight 1.4s ease 1.2s forwards;
  pointer-events:none;
}

@keyframes titleFadeIn{
  to{opacity:1}
}
@keyframes sweepLight{
  from{left:-60%}
  to{left:140%}
}

#tagline{opacity:0;animation:fadeUp .8s ease 2.2s forwards}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(18px)}
  to{opacity:1;transform:translateY(0)}
}
.ni{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.2);transition:all .3s}
.ni:focus{background:rgba(255,255,255,.1);border-color:rgba(255,215,0,.5);outline:none;box-shadow:0 0 15px rgba(255,215,0,.2)}
.nb{background:linear-gradient(135deg,#c21f32,#7a0015);border:1px solid #ff4d64;transition:all .3s;cursor:pointer}
.nb:hover{box-shadow:0 0 20px rgba(194,31,50,.6);transform:translateY(-2px)}
#three-canvas{position:absolute;inset:0;z-index:10;pointer-events:none}
#drag{position:absolute;inset:0;z-index:20;cursor:grab}
#drag:active{cursor:grabbing}
.ctrl{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:25;display:flex;gap:1rem;opacity:.5;transition:opacity .3s}
.ctrl:hover{opacity:1}
.cb{padding:.6rem 1.8rem;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.2);border-radius:4px;color:#fff;font-size:clamp(.7rem,2vw,.85rem);letter-spacing:.15em;text-transform:uppercase;cursor:pointer}
.cb:hover{background:rgba(255,255,255,.1)}
</style>
</head>
<body>

<div id="bg">
  <div id="stage-wall"></div>
  <div id="batten"></div>
  <div id="wing-l"></div>
  <div id="wing-r"></div>
  <div id="floor"></div>
  <div id="spotlight"></div>
  <div id="dust-container"></div>
</div>

<div id="content">
    <img src="logo.png" alt="Logo" style="width:clamp(160px,40vw,360px);margin:0 auto 1.5rem;display:block;filter:drop-shadow(0 0 20px rgba(255,215,0,.3))">
    <h1 id="main-title" class="font-bold tracking-widest" style="text-shadow:0 10px 30px rgba(0,0,0,.8);font-size:clamp(1.8rem,6vw,7rem);letter-spacing:.12em;white-space:nowrap"></h1>
    <p id="tagline" class="text-gray-300 font-light mx-auto" style="font-size:clamp(.85rem,2vw,1.25rem);max-width:90vw"></p>
</div>

<canvas id="three-canvas"></canvas>
<div id="drag"></div>
<div class="ctrl flex">
  <button class="cb" id="btn-open">Open</button>
  <button class="cb" id="btn-close">Close</button>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  CLOTH PHYSICS — manual grid, row 0 = TOP (pinned), row N = BOTTOM
//  Verlet integration + structural/shear/bend constraints
// ═══════════════════════════════════════════════════════════

var W = window.innerWidth, H = window.innerHeight;

// ── Renderer ──────────────────────────────────────────────
var renderer = new THREE.WebGLRenderer({
  canvas: document.getElementById('three-canvas'),
  alpha: true, antialias: true
});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

var scene  = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(52, W / H, 0.01, 100);
camera.position.set(0, 0.3, 4.2);

// ── Lights ────────────────────────────────────────────────
var spotLight = new THREE.SpotLight(0xfff5dc, 4, 30, Math.PI / 4.5, 0.45, 1.2);
spotLight.position.set(0, 6, 5);
spotLight.castShadow = true;
spotLight.shadow.mapSize.width = spotLight.shadow.mapSize.height = 2048;
scene.add(spotLight);
scene.add(spotLight.target);

var fillLight = new THREE.PointLight(0x3a1a0a, 1.0, 14);
fillLight.position.set(0, -3, 2);
scene.add(fillLight);

// Rim light from behind-left for depth
var rimLight = new THREE.PointLight(0x1a0005, 1.5, 10);
rimLight.position.set(-4, 2, -1);
scene.add(rimLight);

scene.add(new THREE.AmbientLight(0x110008, 2.5));

// ── Baked velvet texture (Canvas API) ────────────────────
function makeVelvetTexture() {
  var size = 512;
  var c = document.createElement('canvas');
  c.width = c.height = size;
  var ctx = c.getContext('2d');

  // 1. Base deep burgundy
  ctx.fillStyle = '#3a0008';
  ctx.fillRect(0, 0, size, size);

  // 2. Large-scale dye variation (low-freq noise via radial gradients)
  for (var i = 0; i < 12; i++) {
    var x = Math.random() * size, y = Math.random() * size;
    var r = 80 + Math.random() * 140;
    var g = ctx.createRadialGradient(x, y, 0, x, y, r);
    var bright = Math.random() > 0.5;
    g.addColorStop(0, bright ? 'rgba(120,0,20,0.18)' : 'rgba(10,0,2,0.22)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, size, size);
  }

  // 3. Warp threads — fine vertical lines (fabric weave)
  var threadCount = 180;
  for (var i = 0; i < threadCount; i++) {
    var x = (i / threadCount) * size;
    var bright = (i % 3 === 0);
    ctx.strokeStyle = bright ? 'rgba(180,30,50,0.13)' : 'rgba(0,0,0,0.18)';
    ctx.lineWidth = bright ? 1.2 : 0.7;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, size); ctx.stroke();
  }

  // 4. Weft threads — fine horizontal lines
  var weftCount = 240;
  for (var i = 0; i < weftCount; i++) {
    var y = (i / weftCount) * size;
    ctx.strokeStyle = (i % 4 === 0) ? 'rgba(160,20,35,0.09)' : 'rgba(0,0,0,0.12)';
    ctx.lineWidth = 0.6;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(size, y); ctx.stroke();
  }

  // 5. Velvet pile — random bright fiber dots
  for (var i = 0; i < 6000; i++) {
    var x = Math.random() * size, y = Math.random() * size;
    var r = Math.random() * 1.2;
    var alpha = Math.random() * 0.18 + 0.04;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(220,80,100,' + alpha + ')';
    ctx.fill();
  }

  // 6. Dark fiber shadows
  for (var i = 0; i < 3000; i++) {
    var x = Math.random() * size, y = Math.random() * size;
    ctx.beginPath();
    ctx.arc(x, y, Math.random() * 0.8, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,' + (Math.random() * 0.25 + 0.05) + ')';
    ctx.fill();
  }

  // 7. Subtle sheen streaks (anisotropic highlight simulation)
  for (var i = 0; i < 8; i++) {
    var y = Math.random() * size;
    var g = ctx.createLinearGradient(0, y - 30, 0, y + 30);
    g.addColorStop(0,   'rgba(0,0,0,0)');
    g.addColorStop(0.5, 'rgba(200,60,80,0.07)');
    g.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, y - 30, size, 60);
  }

  var tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(4, 6);
  return tex;
}

var velvetTex = makeVelvetTexture();

// ── Velvet shader ─────────────────────────────────────────
var VERT = [
'varying vec3 vN;',
'varying vec3 vWP;',
'varying vec2 vUV;',
'varying vec3 vV;',
'void main(){',
'  vUV = uv;',
'  vec4 wp = modelMatrix * vec4(position, 1.0);',
'  vWP = wp.xyz;',
'  vN  = normalize(normalMatrix * normal);',
'  vV  = normalize(cameraPosition - wp.xyz);',
'  gl_Position = projectionMatrix * viewMatrix * wp;',
'}'
].join('\n');

var FRAG = [
'uniform vec3      uSheen, uLP, uFP;',
'uniform sampler2D uTex;',
'varying vec3 vN, vWP, vV;',
'varying vec2 vUV;',

// Oren-Nayar
'float orenNayar(vec3 N,vec3 L,vec3 V){',
'  float r2=0.75;',
'  float A=1.0-0.5*r2/(r2+0.33);',
'  float B=0.45*r2/(r2+0.09);',
'  float NdL=max(dot(N,L),0.0);',
'  float NdV=max(dot(N,V),0.001);',
'  float tI=acos(clamp(NdL,-1.0,1.0));',
'  float tR=acos(clamp(NdV,-1.0,1.0));',
'  vec3 Lp=normalize(L-N*NdL);',
'  vec3 Vp=normalize(V-N*NdV);',
'  float cpd=max(dot(Lp,Vp),0.0);',
'  return NdL*(A+B*cpd*sin(max(tI,tR))*tan(min(tI,tR)+0.001));',
'}',

// Velvet sheen
'float velvetSheen(vec3 N,vec3 V,vec3 L){',
'  vec3 H=normalize(V+L);',
'  float NdH=clamp(dot(N,H),0.0,1.0);',
'  float sinH=sqrt(max(0.0,1.0-NdH*NdH));',
'  float NdV=max(dot(N,V),0.001);',
'  float NdL=max(dot(N,L),0.001);',
'  return clamp(pow(sinH,8.0)/(4.0*NdV*NdL),0.0,2.5);',
'}',

'void main(){',
'  vec3 N = normalize(vN);',
'  vec3 V = normalize(vV);',
'  vec3 L1 = normalize(uLP - vWP);',
'  vec3 L2 = normalize(uFP - vWP);',

// Sample baked texture
'  vec3 texCol = texture2D(uTex, vUV).rgb;',

// Lighting
'  float d1 = orenNayar(N, L1, V);',
'  float d2 = orenNayar(N, L2, V) * 0.2;',
'  float sh  = velvetSheen(N, V, L1) * 1.1;',

// Fold AO: normals facing away from camera = darker
'  float facing = max(dot(N, vec3(0.0,0.0,1.0)), 0.0);',
'  float ao = pow(facing, 0.25) * 0.55 + 0.45;',

// Deep fold shadow
'  float foldShadow = pow(facing, 1.6);',
'  texCol *= mix(0.18, 1.0, foldShadow);',

// Combine
'  vec3 col = texCol * (d1 + d2) * ao',
'           + uSheen * sh * texCol * 1.8;',

// Bottom & edge fades
'  float fadeBot  = smoothstep(0.0, 0.04, vUV.y);',
'  float fadeEdge = smoothstep(0.0,0.02,vUV.x)*smoothstep(0.0,0.02,1.0-vUV.x);',
'  col *= fadeBot * fadeEdge;',

// Ambient
'  col += texCol * 0.022;',

'  gl_FragColor = vec4(col, 1.0);',
'}'
].join('\n');

function velvetMat() {
  return new THREE.ShaderMaterial({
    vertexShader: VERT, fragmentShader: FRAG,
    uniforms: {
      uTex:   { value: velvetTex },
      uSheen: { value: new THREE.Color(0.9, 0.3, 0.38) },
      uLP:    { value: spotLight.position },
      uFP:    { value: fillLight.position }
    },
    side: THREE.DoubleSide
  });
}

// ── Cloth grid ────────────────────────────────────────────
var NX = 40, NY = 36;
var VX = NX+1, VY = NY+1;
var N_VERTS = VX * VY;
var CW = 5.5, CH = 6.2;

// İç kenar overlap miktarı — perdeler ortada biraz üst üste başlar
// böylece kapalıyken arada boşluk olmaz ama fizik onları ayırır
var OVERLAP = 0.0;

function vi(col, row) { return row * VX + col; }

// ── Build cloth for one side ───────────────────────────────
function Cloth(isLeft) {
  this.isLeft = isLeft;

  // Particle arrays: pos (current), prev (last frame)
  this.pos  = new Float32Array(N_VERTS * 3);
  this.prev = new Float32Array(N_VERTS * 3);

  // Sol perde z=+0.25 (önde), Sağ perde z=-0.25 (arkada).
  // Bu fark pleat derinliğinden (0.15) büyük olduğu için
  // fizik ne kadar sallansa da perdeler birbirinin önünde/arkasında kalır.
  var Z_FRONT = this.isLeft ? 0.16 : -0.16;
  var PLEAT_COUNT = 18;
  var PLEAT_DEPTH = 0.15;

  for (var row = 0; row < VY; row++) {
    for (var col = 0; col < VX; col++) {
      var i = vi(col, row);
      var t = col / NX;
      var x = isLeft
        ? -CW + t * CW + OVERLAP
        :        t * CW - OVERLAP;
      var y = CH/2 - (row / NY) * CH;
      var rowFade = 1.0 - (row / NY) * 0.3;
      var z = Z_FRONT + Math.sin(t * Math.PI * 2 * PLEAT_COUNT) * PLEAT_DEPTH * rowFade;
      this.pos[i*3]   = x;
      this.pos[i*3+1] = y;
      this.pos[i*3+2] = z;
      this.prev[i*3]   = x;
      this.prev[i*3+1] = y;
      this.prev[i*3+2] = z;
    }
  }

  // Rest lengths (structural + shear + bend)
  this.rl = {};
  var p = this.pos;
  var self = this;
  function addRL(a, b) {
    var dx=p[a*3]-p[b*3], dy=p[a*3+1]-p[b*3+1], dz=p[a*3+2]-p[b*3+2];
    self.rl[a+'_'+b] = Math.sqrt(dx*dx+dy*dy+dz*dz);
  }
  for (var row = 0; row < VY; row++) {
    for (var col = 0; col < VX; col++) {
      if (col < NX)   addRL(vi(col,row),   vi(col+1,row));   // horizontal
      if (row < NY)   addRL(vi(col,row),   vi(col,row+1));   // vertical
      if (col < NX && row < NY) {
        addRL(vi(col,row),   vi(col+1,row+1)); // shear
        addRL(vi(col+1,row), vi(col,row+1));   // shear
      }
      if (col < NX-1) addRL(vi(col,row),   vi(col+2,row));   // bend H
      if (row < NY-1) addRL(vi(col,row),   vi(col,row+2));   // bend V
    }
  }

  // Build Three.js geometry
  this.geo = new THREE.BufferGeometry();

  // Positions & UVs
  var positions = new Float32Array(N_VERTS * 3);
  var uvs       = new Float32Array(N_VERTS * 2);
  for (var row = 0; row < VY; row++) {
    for (var col = 0; col < VX; col++) {
      var i = vi(col, row);
      positions[i*3]   = this.pos[i*3];
      positions[i*3+1] = this.pos[i*3+1];
      positions[i*3+2] = this.pos[i*3+2];
      uvs[i*2]   = col / NX;
      uvs[i*2+1] = 1 - row / NY; // UV y=1 at top
    }
  }

  // Indices (two triangles per quad)
  var indices = [];
  for (var row = 0; row < NY; row++) {
    for (var col = 0; col < NX; col++) {
      var a = vi(col,   row),   b = vi(col+1, row);
      var c = vi(col,   row+1), d = vi(col+1, row+1);
      indices.push(a, b, d,  a, d, c);
    }
  }

  this.geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  this.geo.setAttribute('uv',       new THREE.BufferAttribute(uvs, 2));
  this.geo.setIndex(indices);
  this.geo.computeVertexNormals();

  this.mat  = velvetMat();
  this.mesh = new THREE.Mesh(this.geo, this.mat);
  this.mesh.castShadow = this.mesh.receiveShadow = true;
  // Sol perde önde render edilsin
  this.mesh.renderOrder = isLeft ? 1 : 0;
}

// Physics step
Cloth.prototype.step = function(openProg, dt) {
  var GRAVITY = -0.0008 * dt;
  var DAMP    = 0.988;
  var STIFF   = 0.82;
  var ITERS   = 6;  // reduced from 12 for performance

  // Target x-slide for pinned top row
  var slide = this.isLeft ? -openProg * 3.2 : openProg * 3.2;

  // Verlet integrate (skip row 0 = pinned)
  for (var i = 0; i < N_VERTS; i++) {
    var row = Math.floor(i / VX);
    if (row === 0) continue;
    var px = this.pos[i*3], py = this.pos[i*3+1], pz = this.pos[i*3+2];
    var vx = (px - this.prev[i*3])   * DAMP;
    var vy = (py - this.prev[i*3+1]) * DAMP;
    var vz = (pz - this.prev[i*3+2]) * DAMP;
    this.prev[i*3]=px; this.prev[i*3+1]=py; this.prev[i*3+2]=pz;
    this.pos[i*3]   = px + vx;
    this.pos[i*3+1] = py + vy + GRAVITY;
    this.pos[i*3+2] = pz + vz;
  }

  // Constraint solve
  for (var iter = 0; iter < ITERS; iter++) {
    // Structural + shear + bend
    for (var row = 0; row < VY; row++) {
      for (var col = 0; col < VX; col++) {
        var a = vi(col, row);
        if (col < NX)   this._solveC(a, vi(col+1,row),   STIFF);
        if (row < NY)   this._solveC(a, vi(col,row+1),   STIFF);
        if (col < NX && row < NY) {
          this._solveC(a, vi(col+1,row+1), STIFF * 0.9);
          this._solveC(vi(col+1,row), vi(col,row+1), STIFF * 0.9);
        }
        if (col < NX-1) this._solveC(a, vi(col+2,row),   STIFF * 0.5);
        if (row < NY-1) this._solveC(a, vi(col,row+2),   STIFF * 0.5);
      }
    }

    // Re-pin top row her iterasyonda — Z_FRONT sabit tutulur
    var Z_FRONT = this.isLeft ? 0.16 : -0.16;
    for (var col = 0; col < VX; col++) {
      var pi = vi(col, 0);
      var t  = col / NX;
      var baseX = this.isLeft
        ? -CW + t * CW + OVERLAP + slide
        :        t * CW - OVERLAP + slide;
      var baseZ = Z_FRONT + Math.sin(t * Math.PI * 2 * 18) * 0.15;
      this.pos[pi*3]   = baseX;
      this.pos[pi*3+1] = CH / 2;
      this.pos[pi*3+2] = baseZ;
      this.prev[pi*3]   = baseX;
      this.prev[pi*3+1] = CH / 2;
      this.prev[pi*3+2] = baseZ;
    }
  }

  // Upload to GPU
  var arr = this.geo.attributes.position.array;
  for (var i = 0; i < N_VERTS * 3; i++) arr[i] = this.pos[i];
  this.geo.attributes.position.needsUpdate = true;
  this.geo.computeVertexNormals();
};

Cloth.prototype._solveC = function(a, b, stiff) {
  var key = a+'_'+b;
  var rest = this.rl[key] || this.rl[b+'_'+a];
  if (!rest) return;
  var dx = this.pos[b*3]  -this.pos[a*3];
  var dy = this.pos[b*3+1]-this.pos[a*3+1];
  var dz = this.pos[b*3+2]-this.pos[a*3+2];
  var dist = Math.sqrt(dx*dx+dy*dy+dz*dz) || 0.0001;
  var diff = (dist - rest) / dist * stiff * 0.5;
  var pinnedA = Math.floor(a / VX) === 0;
  var pinnedB = Math.floor(b / VX) === 0;
  if (!pinnedA) { this.pos[a*3]+=dx*diff; this.pos[a*3+1]+=dy*diff; this.pos[a*3+2]+=dz*diff; }
  if (!pinnedB) { this.pos[b*3]-=dx*diff; this.pos[b*3+1]-=dy*diff; this.pos[b*3+2]-=dz*diff; }
};

// ── 3D Model (GLB) ────────────────────────────────────────
var modelGroup = new THREE.Group();
modelGroup.position.set(0, -0.2, 0.5);
modelGroup.visible = false;
scene.add(modelGroup);

// GLTFLoader — Three.js r128 global script olarak yüklü değil,
// inline olarak minimal loader yazıyoruz
var gltfScript = document.createElement('script');
gltfScript.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/loaders/GLTFLoader.js';
gltfScript.onload = function() {
  var loader = new THREE.GLTFLoader();
  loader.load('../Untitled.glb', function(gltf) {
    var model = gltf.scene;

    // Boyutu normalize et
    var box = new THREE.Box3().setFromObject(model);
    var size = new THREE.Vector3();
    box.getSize(size);
    var maxDim = Math.max(size.x, size.y, size.z);
    var scale = 1.6 / maxDim;
    model.scale.setScalar(scale);

    // Merkeze al
    var center = new THREE.Vector3();
    box.getCenter(center);
    model.position.sub(center.multiplyScalar(scale));

    // Işık alabilmesi için materyal güncelle
    model.traverse(function(child) {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
      }
    });

    // Placeholder küpü kaldır, modeli ekle
    while (modelGroup.children.length) modelGroup.remove(modelGroup.children[0]);
    modelGroup.add(model);
  }, undefined, function(err) {
    console.error('GLB yüklenemedi:', err);
  });
};
document.head.appendChild(gltfScript);
var clothL = new Cloth(true);
var clothR = new Cloth(false);
scene.add(clothL.mesh);
scene.add(clothR.mesh);

// Gold fringe
function makeFringe() {
  var g = new THREE.PlaneGeometry(CW, 0.07, NX, 1);
  var m = new THREE.MeshStandardMaterial({
    color:0xd4a017, metalness:0.95, roughness:0.15,
    side:THREE.DoubleSide, emissive:0x4a3200, emissiveIntensity:0.5
  });
  return new THREE.Mesh(g, m);
}
var fringeL = makeFringe(), fringeR = makeFringe();
scene.add(fringeL); scene.add(fringeR);

function updateFringe(fringe, cloth) {
  // Average bottom row position
  var sx=0, sy=0, sz=0;
  var bottomRow = NY; // last row index
  for (var col = 0; col < VX; col++) {
    var i = vi(col, bottomRow);
    sx += cloth.pos[i*3];
    sy += cloth.pos[i*3+1];
    sz += cloth.pos[i*3+2];
  }
  fringe.position.set(sx/VX, sy/VX, sz/VX + 0.005);
}

// ── Interaction ───────────────────────────────────────────
var openProgress = 0, targetOpen = 0;
var drag = document.getElementById('drag');
var isDragging = false, dragStartX = 0, dragStartProg = 0;

drag.addEventListener('pointerdown', function(e) {
  isDragging = true; dragStartX = e.clientX; dragStartProg = targetOpen;
  drag.setPointerCapture(e.pointerId);
});
drag.addEventListener('pointermove', function(e) {
  if (!isDragging) return;
  targetOpen = Math.max(0, Math.min(1, dragStartProg + (e.clientX - dragStartX) / (W * 0.38)));
});
drag.addEventListener('pointerup', function() {
  isDragging = false;
  targetOpen = targetOpen > 0.42 ? 1 : 0;
});
drag.addEventListener('pointercancel', function() { isDragging = false; });

document.getElementById('btn-open').addEventListener('click',  function() { targetOpen = 1; });
document.getElementById('btn-close').addEventListener('click', function() { targetOpen = 0; });

// ── HTML refs ─────────────────────────────────────────────
var contentEl   = document.getElementById('content');
var spotlightEl = document.getElementById('spotlight');
var floorEl     = document.getElementById('floor');

window.addEventListener('resize', function() {
  W = window.innerWidth; H = window.innerHeight;
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  renderer.setSize(W, H);
});

window.addEventListener('mousemove', function(e) {
  if (openProgress > 0.5)
    spotLight.position.x = (e.clientX / W - 0.5) * 1.5;
});

// ── Dust ──────────────────────────────────────────────────
var dc = document.getElementById('dust-container');
for (var di = 0; di < 30; di++) {
  (function() {
    var p = document.createElement('div');
    p.className = 'dust';
    var s = Math.random()*3+1;
    p.style.cssText = 'width:'+s+'px;height:'+s+'px;left:'+(Math.random()*100)+'%;top:110%';
    dc.appendChild(p);
    var dur = (Math.random()*10+10)*1000;
    function loop() {
      setTimeout(function() {
        p.style.transition='none'; p.style.opacity='0';
        p.style.top=(110+Math.random()*20)+'%';
        p.style.left=(Math.random()*100)+'%';
        setTimeout(function() {
          p.style.transition='transform '+dur+'ms linear,opacity '+(dur*0.3)+'ms';
          p.style.transform='translateY(-'+(H+200)+'px) translateX('+(Math.random()*80-40)+'px)';
          p.style.opacity=(Math.random()*0.35+0.05).toString();
          setTimeout(loop, dur+100);
        }, 60);
      }, Math.random()*12000);
    }
    loop();
  })();
}

// ── Yazı animasyonu ───────────────────────────────────────
(function initTextAnim() {
  // Ana başlığı harf harf span'a böl
  var title = document.getElementById('main-title');
  var text  = 'OPENING SOON';
  title.innerHTML = text.split('').map(function(ch, i) {
    var delay = 0.8 + i * 0.055;
    var content = ch === ' ' ? '&nbsp;' : ch;
    return '<span class="char" style="animation-delay:' + delay + 's">' + content + '</span>';
  }).join('');

  // Tagline
  document.getElementById('tagline').textContent = 'Our new cinematic art course experience is almost ready. Take your seat.';
})();

// ── Render loop ───────────────────────────────────────────
var lastTime = performance.now();

function animate() {
  requestAnimationFrame(animate);

  var now = performance.now();
  var dt  = Math.min((now - lastTime) / 16.67, 3); // normalized to 60fps, cap at 3x
  lastTime = now;

  openProgress += (targetOpen - openProgress) * 0.008;

  clothL.step(openProgress, dt);
  clothR.step(openProgress, dt);
  updateFringe(fringeL, clothL);
  updateFringe(fringeR, clothR);

  spotLight.intensity = 6.0 + openProgress * 18;
  fillLight.intensity = 2.0 + openProgress * 4.0;

  var prog = Math.min(1, openProgress);

  spotlightEl.style.opacity = 0.1 + prog * 1.8;
  floorEl.style.opacity     = 0.5  + prog * 0.5;

  // 3D model: perdeler açılınca görünür, y ekseninde rotate
  if (prog > 0.7) {
    modelGroup.visible = true;
    modelGroup.rotation.y += 0.008;
  } else {
    modelGroup.visible = false;
  }

  renderer.render(scene, camera);
}

animate();
</script>
